events {}

http {
    # Define a rate limiting zone named "mylimit"
    # Allocates 10MB for state storage.
    # Rate is limited to 1 request per second per IP ($binary_remote_addr).
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=1r/s;

    server {
        listen 80;

        location / {
            # Apply the rate limit zone
            # burst=5 allows a burst of up to 5 requests to be queued
            # nodelay ensures requests within the burst are served immediately (no artificial delay), 
            # but still enforcing the long-term 1r/s average.
            limit_req zone=mylimit burst=5 nodelay;

            proxy_pass http://backend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
