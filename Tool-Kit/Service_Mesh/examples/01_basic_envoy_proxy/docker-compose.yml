version: '3.8'
services:
  envoy:
    image: envoyproxy/envoy:v1.28.0
    ports:
      - "10000:10000"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - backend

  backend:
    image: hashicorp/http-echo:latest
    command: -text="Hello from the backend!"
    ports:
      - "80:5678"
