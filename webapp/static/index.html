<!doctype html>
<html lang="en" data-theme="dark" data-theme-pref="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Ultimate Engineering Guide</title>
<script>
/* Paint the right theme BEFORE first paint. The server round-trip that loads
   settings.theme finishes long after this, so without it every reload flashes
   the wrong ground. localStorage mirrors the server copy; "system" follows
   prefers-color-scheme. */
(function () {
  var pref = 'system';
  try { pref = localStorage.getItem('dsa-theme') || 'system'; } catch (e) {}
  var dark = pref === 'dark' ||
    (pref === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
  var r = document.documentElement;
  r.dataset.theme = dark ? 'dark' : 'light';
  r.dataset.themePref = pref;
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">

<link rel="stylesheet" href="/reader.css">

<link rel="stylesheet" href="/sd.css">
<link rel="stylesheet" href="/home.css">
<link rel="stylesheet" href="/dsa-home.css">
<link rel="stylesheet" href="/problem-doc.css">
<link rel="stylesheet" href="/dsa-viz.css">
<link rel="stylesheet" href="/dsa-topic.css">
<link rel="stylesheet" href="/sd-flow.css">

<body>

<div id="app" class="app">

  <!-- ==================== TOP BAR ==================== -->
  <header class="topbar">
    <button class="icon-btn" id="toggleSidebar" title="Toggle sidebar (⌘B)" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <a class="brand" href="#/home" aria-label="Ultimate Engineering Guide — home">
      <img class="brand-mark" src="/logo.svg" alt="" width="30" height="30">
      <span class="brand-text">
        <span class="brand-name">Ultimate Engineering Guide</span>
        <span class="brand-tag">Algorithms · Systems · Data · AI</span>
      </span>
    </a>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search the library…   /" autocomplete="off" spellcheck="false">
      <kbd class="search-kbd">/</kbd>
    </div>

    <div class="topbar-right">
      <div class="timer" id="timer" hidden>
        <button class="timer-toggle" id="timerToggle" title="Start / pause (⌘⇧T)">
          <svg class="ico-play" viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24"><path d="M8 4h3v16H8zM13 4h3v16h-3z"/></svg>
        </button>
        <span class="timer-value" id="timerValue">00:00</span>
        <div class="timer-phase" id="timerPhase">solo</div>
      </div>

      <div class="streak" id="streak" title="Practice streak">
        <svg viewBox="0 0 24 24"><path d="M12 2s5 5 5 9a5 5 0 01-10 0c0-2 1-3 1-3s0 2 2 2 2-8 2-8z"/></svg>
        <span id="streakValue">0</span>
      </div>

      <button class="icon-btn palette-btn" id="paletteBtn" title="Quick jump (⌘K)" aria-label="Quick jump">
        <svg viewBox="0 0 24 24"><path d="M15 9V6a3 3 0 113 3zM9 9V6a3 3 0 10-3 3zM15 15v3a3 3 0 103-3zM9 15v3a3 3 0 11-3-3zM9 9h6v6H9z"/></svg>
      </button>

      <button class="icon-btn" id="themeToggle" title="Theme: system" aria-label="Theme: system">
        <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z"/></svg>
        <svg class="ico-system" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M9 21h6M12 17v4"/></svg>
      </button>

      <button class="icon-btn" id="toggleRightSidebar" title="Toggle right outline" aria-label="Toggle right outline" style="display: none;">
        <svg viewBox="0 0 24 24"><path d="M21 6h-18M21 12h-18M21 18h-18M15 3v18"/></svg>
      </button>
    </div>
  </header>

  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar" id="sidebar">
    <nav class="nav-main" aria-label="Sections">
    <a class="nav-item" id="navDashboard" href="#/dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z"/></svg>
      <span>Dashboard</span>
    </a>
    <a class="nav-item" id="navReview" href="#/review">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      <span>Review queue</span>
      <span class="nav-badge" id="reviewBadge" hidden>0</span>
    </a>
    </nav>

    <!-- Modules — or, while the search box has something in it, the matches
         across all of them. app.js -->
    <nav class="modules" id="modules" aria-label="Modules"></nav>

    <div class="sidebar-foot">
      <div class="overall">
        <div class="overall-bar"><div class="overall-fill" id="overallFill"></div></div>
        <div class="overall-text"><span id="overallText">0 / 275</span></div>
      </div>
    </div>
  </aside>

  <!-- Phone/narrow-tablet only: dims the page behind the sidebar overlay and
       closes it on tap, same as any modal scrim. -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <!-- Quick jump (⌘K) -->
  <div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Quick jump">
    <div class="palette-scrim"></div>
    <div class="palette-box">
      <div class="palette-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="paletteInput" type="text" placeholder="Jump to a problem, chapter or module…"
               autocomplete="off" spellcheck="false" role="combobox" aria-controls="paletteList" aria-expanded="true">
        <kbd>esc</kbd>
      </div>
      <div class="palette-list" id="paletteList" role="listbox"></div>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span>every word must match</span></div>
    </div>
  </div>

  <!-- ==================== MAIN ==================== -->
  <main class="main" id="main">

    <!-- Landing page behind the logo — home.js -->
    <section class="view" id="viewHome" hidden></section>

    <!-- Dashboard -->
    <section class="view" id="viewDashboard"></section>

    <!-- Review queue -->
    <section class="view" id="viewReview" hidden></section>

    <!-- DSA landing page — dsa-home.js -->
    <section class="view" id="viewDsaHome" hidden></section>

    <!-- One DSA pattern and its problems — dsa-topic.js -->
    <section class="view" id="viewDsaTopic" hidden></section>

    <!-- Learning module landing page (System Design, Go/Py Engineering,
         AI Roadmap, AI Library Guides, Agentic AI) — reader.js -->
    <section class="view" id="viewModuleHome" hidden></section>

    <!-- Learning module reader -->
    <section class="view" id="viewDocReader" hidden></section>

    <!-- API practice: one style's Foundation ladder + labs (#/api-type/<Type>) -->
    <section class="view" id="viewApiType" hidden></section>

    <!-- Stdlib practice: one package's guide + level ladder (#/stdlib-pkg/<lang>/<pkg>) -->
    <section class="view" id="viewStdlibPkg" hidden></section>

    <!-- Problem workspace -->
    <section class="view workspace" id="viewProblem" hidden>
      <div class="problem-head">
        <div class="problem-head-main">
          <div class="crumb" id="crumb"></div>
          <h1 class="problem-title" id="problemTitle"></h1>
          <div class="problem-meta">
            <span class="pill" id="diffPill"></span>
            <a class="lc-link" id="lcLink" target="_blank" rel="noopener">
              LeetCode <svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg>
            </a>
          </div>
        </div>
        <button class="icon-btn code-toggle" id="toggleCode" aria-pressed="true"
                title="Hide code panel (⌘\)" aria-label="Toggle code panel">
          <svg viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/></svg>
        </button>
        <div class="status-group" id="statusGroup" role="group" aria-label="Problem status">
          <button class="status-btn" data-status="todo"      title="Not started">○</button>
          <button class="status-btn" data-status="attempting" title="In progress">◐</button>
          <button class="status-btn" data-status="solved"    title="Solved">●</button>
          <button class="status-btn" data-status="mastered"  title="Mastered — solved cold in ≤20 min" aria-label="Mastered">★</button>
        </div>
      </div>

      <div class="split" id="split">
        <!-- Prose -->
        <div class="pane pane-prose">
          <div class="tabs" id="proseTabs">
            <button class="tab is-on" data-tab="question">Question</button>
            <button class="tab" data-tab="solution">Solution</button>
            <button class="tab" data-tab="notes">Notes</button>
          </div>
          <div class="pane-body" id="proseBody"></div>
        </div>

        <div class="gutter" id="gutter" role="separator" aria-label="Resize panes"></div>

        <!-- Editor -->
        <div class="pane pane-editor">
          <div class="editor-bar">
            <div class="lang-switch" id="langSwitch">
              <button class="lang is-on" data-lang="py">Python</button>
              <button class="lang" data-lang="go">Go</button>
            </div>
            <div class="editor-actions">
              <span class="save-dot" id="saveDot" title="All changes saved">saved</span>
              <button class="btn btn-ghost" id="btnFormat" title="gofmt (Go only)" hidden>Format</button>
              <button class="btn btn-ghost" id="btnReset" title="Restore the original stub">Reset</button>
              <button class="btn btn-primary" id="btnRun" title="Run (⌘⏎)">
                <svg viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z"/></svg> Run
              </button>
            </div>
          </div>
          <div class="editor-host" id="editorHost">
            <textarea id="editor" spellcheck="false"></textarea>
          </div>
          <div class="editor-status" id="editorStatus">
            <span id="esCursor">Ln 1, Col 1</span>
            <span id="esSel" hidden></span>
            <span class="es-sep" id="esIndent">Spaces: 4</span>
            <span id="esLang">Python</span>
          </div>
          <div class="console" id="console">
            <div class="console-resize" id="consoleResize" role="separator" aria-orientation="horizontal"
                 aria-label="Resize output panel" tabindex="0" title="Drag to resize · double-click to collapse"></div>
            <div class="console-bar" id="consoleBar">
              <button class="console-fold" id="btnFoldConsole" aria-expanded="true" aria-label="Collapse output"
                      title="Collapse / expand output (⌘J)">
                <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
                <span class="console-title">Output</span>
              </button>
              <span class="console-stat" id="consoleStat"></span>
              <button class="icon-btn sm" id="btnCopyConsole" title="Copy output" aria-label="Copy output">
                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>
              </button>
              <button class="icon-btn sm" id="btnClearConsole" title="Clear" aria-label="Clear output">
                <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>
            <pre class="console-body" id="consoleBody"><span class="muted">Press <kbd>⌘</kbd><kbd>⏎</kbd> to run your code.</span></pre>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast-stack" id="toasts"></div>
</div>
