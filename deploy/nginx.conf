# nginx config for the static build (used by deploy/Dockerfile).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Third-party libraries under versioned paths (vendor/<lib>/<x.y.z>/): cache for a year.
    location ~ ^/vendor/[^/]+/[0-9]+\.[0-9]+\.[0-9]+/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else changes with each deploy: always revalidate.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
