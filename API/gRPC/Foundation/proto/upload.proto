// FOUNDATION LEVEL 04 - client streaming: many requests, one response.
syntax = "proto3";

package foundation.upload.v1;

option go_package = "dsapractice/api/gRPC/Foundation/golang/pb/uploadpb;uploadpb";

service Uploader {
  // "stream" on the REQUEST type this time.
  rpc UploadReadings(stream Reading) returns (UploadSummary);
}

message Reading {
  string sensor = 1;
  double value = 2;
}

message UploadSummary {
  int32 count = 1;
  double sum = 2;
  double average = 3;
}
